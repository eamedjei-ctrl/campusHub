<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buyer Login | CampusLink</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">CampusLink</a>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="#">Browse</a>
      <a href="#">Sell</a>
      <a href="#">Safety</a>
    </nav>
    <div class="header-actions">
      <a href="login-seller.html" style="font-size: 14px; font-weight: 700; color: var(--accent);">Become a Seller</a>
    </div>
  </header>

  <main class="login-container">
    <div class="login-card">
      <nav class="user-toggle">
        <a href="login-buyer.html" class="active">Buyer</a>
        <a href="login-seller.html">Seller</a>
      </nav>
      <h1>Welcome Back</h1>
      <p>Log in to find the best deals on your campus.</p>
      
      <form action="#">
        <div class="form-group">
          <label for="email">Student Email</label>
          <input type="email" id="email" placeholder="you@university.edu.ng" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-submit">Sign In as Buyer</button>
      </form>

      <div class="login-footer">
        Don't have an account? <a href="#">Register here</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div>
      <h2>CampusLink</h2>
      <p>© 2024 CampusLink. Built for the ambitious student.</p>
    </div>
  </footer>
</body>
</html>
